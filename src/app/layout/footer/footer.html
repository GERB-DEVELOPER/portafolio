<footer class="footer">
    <div class="container footer-inner">

        <!-- Año automático: viene de la propiedad "year" de footer.ts -->
        <p>© {{ year }} {{ profile.name }}. Hecho con Angular.</p>

        <!-- Redes sociales -->
        <div class="footer-social">
            @for (social of profile.socials; track social.url) {
            <a [href]="social.url" target="_blank" [attr.aria-label]="social.label">
                <i class="bi {{ social.icon }}"></i>
            </a>
            }
        </div>


    </div>
</footer>

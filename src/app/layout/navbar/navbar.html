<header class="navbar">
    <nav class="container navbar-inner">

        <!-- Logo / nombre: lleva al Inicio -->
        <a routerLink="/" class="navbar-brand" aria-label="Ir al inicio">
            <img src="favicon.png" alt="" class="navbar-logo" width="40" height="40">
            {{ profile.initials }}
        </a>

        <!-- Enlaces del menú -->
        <ul id="main-menu" class="navbar-links" [class.open]="menuOpen()" (click)="closeMenu()">

            <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a></li>
            <li><a routerLink="/sobre-mi" routerLinkActive="active">Sobre mí</a></li>
            <li><a routerLink="/proyectos" routerLinkActive="active">Proyectos</a></li>
            <li><a routerLink="/contacto" routerLinkActive="active">Contacto</a></li>
            <li><a routerLink="/guia" routerLinkActive="active">Guia de Estilos</a></li>
        </ul>
        <!-- Botones de acción -->
        <div class="navbar-actions">
            <!-- NUEVO: selector de paleta -->
            <div class="palette-picker">
                <button type="button" class="icon-btn" (click)="togglePaletteMenu()"
                    aria-label="Cambiar paleta de colores" [attr.aria-expanded]="paletteOpen()">
                    <i class="bi bi-palette"></i>
                </button>

                @if (paletteOpen()) {
                <ul class="palette-menu">
                    @for (p of palettes; track p.id) {
                    <li>
                        <button type="button" class="palette-option" [class.active]="palette() === p.id"
                            (click)="setPalette(p.id)">
                            <span class="palette-dot" [style.background-color]="p.color"></span>
                            {{ p.label }}
                            @if (palette() === p.id) {
                            <i class="bi bi-check2"></i>
                            }
                        </button>
                    </li>
                    }
                </ul>
                }
            </div>

            <button type="button" class="icon-btn" (click)="toggleTheme()"
                [attr.aria-label]="isDark() ? 'Activar modo claro' : 'Activar modo oscuro'">
                @if (isDark()) {
                <i class="bi bi-sun"></i>
                } @else {
                <i class="bi bi-moon-stars"></i>
                }
            </button>
            <button type="button" class="icon-btn menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()"
                aria-controls="main-menu" aria-label="Abrir menú">
                @if (menuOpen()) {
                <i class="bi bi-x-lg"></i>
                } @else {
                <i class="bi bi-list"></i>
                }
            </button>

        </div>

    </nav>
</header>

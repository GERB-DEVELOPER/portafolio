<!doctype html>
<html lang="es" data-palette="violeta" data-theme="dark">

<head>
  <meta charset="utf-8">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="logogerb.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- Aplica el tema ANTES de que cargue Angular, para evitar un destello claro -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');                                  // 1. ¿hay uno guardado?
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; // 2. ¿el sistema está en oscuro?
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>


</head>

  <app-root></app-root>
</body>

</html>
